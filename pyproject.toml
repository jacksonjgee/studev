[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "studev"
version = "0.1.0"
description="Offline coding practice for students. No setup, no account, no internet."
requires-python = ">=3.9"
dependencies = ["rich"]

[project.scripts]
studev = "studev.cli:main"